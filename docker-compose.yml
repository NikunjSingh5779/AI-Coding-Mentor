services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: mentor
      POSTGRES_USER: mentor
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mentor -d mentor"]
      interval: 10s
      timeout: 5s
      retries: 10

  sandbox-python:
    build:
      context: ./sandbox/images/python
      dockerfile: Dockerfile
    image: coding-mentor-python:latest
    restart: "no"
    command: ["python", "--version"]

  sandbox-javascript:
    build:
      context: ./sandbox/images/javascript
      dockerfile: Dockerfile
    image: coding-mentor-javascript:latest
    restart: "no"
    command: ["node", "--version"]

  sandbox-cpp:
    build:
      context: ./sandbox/images/cpp
      dockerfile: Dockerfile
    image: coding-mentor-cpp:latest
    restart: "no"
    command: ["g++", "--version"]

  sandbox-java:
    build:
      context: ./sandbox/images/java
      dockerfile: Dockerfile
    image: coding-mentor-java:latest
    restart: "no"
    command: ["java", "-version"]

  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    environment:
      SANDBOX_SECRET: dev-only-change-me
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      sandbox-python:
        condition: service_completed_successfully
      sandbox-javascript:
        condition: service_completed_successfully
      sandbox-cpp:
        condition: service_completed_successfully
      sandbox-java:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://mentor:password@db:5432/mentor
      SANDBOX_URL: http://sandbox:8100
      SANDBOX_SECRET: dev-only-change-me
      EXECUTION_ENABLED: "true"
      FEATURE_SCREEN_SOURCE: "true"
      LLM_ENABLED: "true"
      LLM_BASE_URL: http://host.docker.internal:8080/v1
      LLM_API_KEY: "none"
      LLM_MODEL: "auto"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      sandbox:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: frontend-dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: pnpm dev --host
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  backend_venv:
