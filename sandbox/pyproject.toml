[project]
name = "mentor-sandbox-runner"
version = "0.1.0"
description = "AI Real-Time Coding Screener - Sandbox Runner"
authors = ["AI Real-Time Coding Screener Team"]
requires-python = ">=3.11"
readme = "README.md"

[project.dependencies]
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pydantic = "^2.5.0"
docker = "^7.0.0"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "isolation: marks tests as sandbox isolation tests",
    "limits: marks tests as resource limit tests"
]
asyncio_mode = "auto"
