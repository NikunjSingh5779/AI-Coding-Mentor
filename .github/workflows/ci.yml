name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.11'

jobs:
  # Backend Tests
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mentor_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install uv
      run: pip install uv

    - name: Install dependencies
      run: |
        cd backend
        uv sync --dev

    - name: Lint with Ruff
      run: |
        cd backend
        uv run ruff check .

    - name: Format check with Ruff
      run: |
        cd backend
        uv run ruff format --check .

    - name: Type check with mypy
      run: |
        cd backend
        uv run mypy .

    - name: Run tests
      env:
        DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mentor_test
        APP_ENV: test
      run: |
        cd backend
        uv run pytest --cov=app --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage.xml
        flags: backend

  # Frontend Tests
  frontend-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'pnpm'
        cache-dependency-path: frontend/pnpm-lock.yaml

    - name: Install pnpm
      run: npm install -g pnpm@11.8.0

    - name: Install dependencies
      run: |
        cd frontend
        pnpm install

    - name: Lint
      run: |
        cd frontend
        pnpm lint

    - name: Type check
      run: |
        cd frontend
        pnpm typecheck

    - name: Run tests
      run: |
        cd frontend
        pnpm test --run --coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./frontend/coverage/coverage-final.json
        flags: frontend

  # Sandbox Tests
  sandbox-tests:
    if: ${{ hashFiles('sandbox/tests/**/*.py') != '' }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install uv
      run: pip install uv

    - name: Install sandbox dependencies
      run: |
        cd sandbox
        uv sync --dev

    - name: Run sandbox isolation tests
      run: |
        cd sandbox
        uv run pytest tests/ -m "isolation or limits"

  # End-to-End Tests
  e2e-tests:
    if: ${{ hashFiles('frontend/e2e/**/*') != '' }}
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mentor_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'pnpm'
        cache-dependency-path: frontend/pnpm-lock.yaml

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        npm install -g pnpm
        pip install uv
        cd frontend && pnpm install
        cd ../backend && uv sync

    - name: Install Playwright browsers
      run: |
        cd frontend
        pnpm exec playwright install --with-deps

    - name: Start services
      run: |
        docker compose up -d db
        cd backend && uv run uvicorn app.main:app --port 8000 &
        cd frontend && pnpm dev &
        sleep 30
      env:
        DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mentor_e2e
        APP_ENV: test

    - name: Run E2E tests
      run: |
        cd frontend
        pnpm e2e

    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 30

  # Security Scan
  security-scan:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  # Docker Build
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build backend image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        target: production
        push: false
        tags: mentor-backend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        target: frontend-prod
        push: false
        tags: mentor-frontend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build sandbox image
      uses: docker/build-push-action@v5
      with:
        context: ./sandbox/images/python
        push: false
        tags: mentor-sandbox-python:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max