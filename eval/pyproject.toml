[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-coding-mentor-eval"
version = "0.0.0"
description = "AI Real-Time Coding Screener Evaluation Suite"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "AI Coding Mentor Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "pydantic>=2.5.0",
    "structlog>=23.2.0",
    "httpx>=0.25.2",
    "pandas>=2.1.4",
    "numpy>=1.24.4",
    "matplotlib>=3.8.2",
    "seaborn>=0.13.0",
    "jinja2>=3.1.2",
    "opencv-python-headless>=4.8.1.78",
    "pillow>=10.1.0",
    "pytesseract>=0.3.10",
    "easyocr>=1.7.0",
    "scikit-learn>=1.3.2",
    "rapidfuzz>=3.5.2",
    "click>=8.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.7",
    "mypy>=1.7.1",
    "jupyter>=1.0.0",
    "ipykernel>=6.27.1",
]

[project.scripts]
eval-run = "harness.run_eval:main"
eval-bench = "harness.bench_latency:main"
eval-report = "harness.report:main"

[project.urls]
Homepage = "https://github.com/ai-coding-mentor/ai-coding-mentor"
Repository = "https://github.com/ai-coding-mentor/ai-coding-mentor.git"
Issues = "https://github.com/ai-coding-mentor/ai-coding-mentor/issues"

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "ARG002", # unused method argument
    "ARG001", # unused function argument
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"notebooks/**/*" = ["ALL"]  # Allow all in Jupyter notebooks

[tool.ruff.isort]
known-first-party = ["harness", "datasets"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "pytesseract.*",
    "easyocr.*",
    "matplotlib.*",
    "seaborn.*",
    "pandas.*",
    "sklearn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["harness"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "gpu: marks tests that need GPU",
]